name: claude

# Two jobs, because claude-code-action v1 picks its mode from whether `prompt` is set:
#  - review:  every non-draft PR (opened, new commits, ready, reopened) → Claude reviews it
#  - respond: "@claude …" in an issue or PR comment → Claude answers
#
# ⚠ Until 2026-09-10 this was one job on @beta with no prompt. That only ever answered
# @claude mentions: on a PR event it skipped itself ("No trigger was met") and the check
# went green. No PR was ever actually reviewed.
#
# Setup once: the ANTHROPIC_API_KEY repo secret (not set yet — until it is, the review
# job fails), and the Claude GitHub App (https://github.com/apps/claude) installed on the
# repo. A PR that edits this file can't run the action — it must match the default
# branch — so the first real review lands on the PR after the one that changes it.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    # GitHub-hosted: stazzona has no scale set for this repo (see ci.yaml).
    runs-on: ubuntu-latest
    # A new push supersedes the review of the previous one.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so Claude can read diff context

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only the repo and PR number go into the prompt — never PR titles, bodies or
          # branch names, which the PR author controls.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repo is Terraform (azurerm ~> 5.4) for Azure
            connectivity: a secured Virtual WAN (Standard hub + Azure Firewall + routing
            intent per region, gated behind secured_vwan_enabled because it costs about
            $470/month per hub) with the address plan in Azure Virtual Network Manager
            (AVNM) IPAM pools. Especially flag:
              - anything that makes hourly-billed resources plan while
                secured_vwan_enabled is false, or flips its default to true;
              - hub_address_prefix ranges not reserved as static CIDRs in their region
                pool, or overlapping the homelab (10.1.0.0/23);
              - any change that forces replacement of an IPAM pool, virtual hub,
                firewall or network manager (name, location, prefixes); call it out
                loudly, because replacing a hub drops its spoke connections;
              - routing intent that stops sending private or internet traffic through
                the hub firewall;
              - committed tenant/subscription ids, tfvars or backend.hcl.

            Post each concrete problem as an inline comment on the line concerned, then
            one short top-level summary comment. If nothing needs changing, say so in
            one line rather than padding the review.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  respond:
    if: |
      (github.event_name == 'issue_comment'               && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `prompt`, so v1 runs in interactive mode and answers the @claude mention.
      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5
