name: ci

on:
  pull_request:
  push:
    branches: [main]

# Don't waste CI minutes if a newer push lands while we're running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Exact pin — verified to exist (hashicorp/terraform v1.16.2, released 2026-09-09).
  TF_VERSION: 1.16.2
  TF_IN_AUTOMATION: "1"

# GitHub-hosted, NOT stazzona (the benoitnvl account's self-hosted runners).
# benoitnvl is a user account, so self-hosted runners are per-repo, and there's
# no scale set for this repo: `runs-on: stazzona` just sits queued forever. PR #1
# did.
#
# CI never touches Azure: no credentials, `init -backend=false`, and the tests run
# against a mocked azurerm provider. `make plan/apply` from a workstation is the
# only write path.
jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # We don't use the wrapper's step outputs; plain terraform keeps logs clean.
          terraform_wrapper: false
      - name: fmt check (recursive)
        run: terraform fmt -check -recursive
        # Hint: run `make fmt` locally and re-push to fix.

  validate-test:
    name: terraform validate + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init (no backend)
        working-directory: infra
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: infra
        run: terraform validate
      - name: terraform test (mocked azurerm)
        working-directory: infra
        run: terraform test

  azure-ipam:
    name: azure-ipam wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x azure-ipam/ipam.sh scripts/test-azure-ipam.sh
      - name: wrapper tests (stubbed pwsh/git/curl/bicep, no Azure)
        run: bash scripts/test-azure-ipam.sh

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # IaC-misconfig + secret scan. Blocks on HIGH/CRITICAL; add a `.trivyignore`
      # entry (with a reason) for any accepted finding.
      - name: Trivy config + secret scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
